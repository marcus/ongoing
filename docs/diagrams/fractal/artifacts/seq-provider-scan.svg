  <title id="sequence-title">A scan on a machine that is not aerie</title><desc id="sequence-description">No td, no cloc, no gh, no GitHub token, no launchd. The scan completes, the missing providers are reported unavailable, nothing records a collector warning, and the rules that read their fields stay inert rather than wrong.</desc><metadata>{&quot;journeyId&quot;:&quot;provider-scan&quot;,&quot;provenance&quot;:&quot;Authored 2026-09-11 from ADR 0007; observed 2026-09-12 once Phase 5 built it. tests/integration/providers.test.ts runs exactly this: a real scan in a child process whose PATH holds only git, asserting a completed run, zero collector errors, and provider_runs rows that name the missing command.&quot;,&quot;hiddenLanes&quot;:[],&quot;rows&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;host-init&quot;,&quot;host-config&quot;,&quot;config-enabled&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;host&quot;,&quot;config&quot;,&quot;providers&quot;]},{&quot;id&quot;:&quot;host-init&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;host-init&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;host&quot;]},{&quot;id&quot;:&quot;host-config&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;host-config&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;host&quot;,&quot;config&quot;]},{&quot;id&quot;:&quot;config-enabled&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;config-enabled&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;config&quot;,&quot;providers&quot;]},{&quot;id&quot;:&quot;declare&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;manifest-probe&quot;,&quot;manifest-register&quot;,&quot;manifest-set&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;providers&quot;,&quot;registry&quot;,&quot;scanner&quot;]},{&quot;id&quot;:&quot;manifest-probe&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;manifest-probe&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;providers&quot;,&quot;registry&quot;]},{&quot;id&quot;:&quot;manifest-register&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;manifest-register&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;providers&quot;,&quot;registry&quot;]},{&quot;id&quot;:&quot;manifest-set&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;manifest-set&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;providers&quot;,&quot;scanner&quot;]},{&quot;id&quot;:&quot;run&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;scan-discover&quot;,&quot;scan-collect&quot;,&quot;scan-finish&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;scanner&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;scan-discover&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;scan-discover&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;scanner&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;scan-collect&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;scan-collect&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;scanner&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;scan-finish&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;scan-finish&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;scanner&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;explain&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;providers-ask&quot;,&quot;providers-report&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;host&quot;,&quot;providers&quot;]},{&quot;id&quot;