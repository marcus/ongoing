      <text x="656" y="1178" text-anchor="middle" font-size="13" fill="#66766d"><tspan x="656" dy="0">Every field the entry carries, stored and</tspan><tspan x="656" dy="17">projected alike</tspan></text>
      <text x="656" y="1219" text-anchor="middle" font-size="11" fill="#78867c"><tspan x="656" dy="0">The dashboard payload carries the same attributes, so</tspan><tspan x="656" dy="15">`ongoing show` and `ongoing list --json` see the new field</tspan><tspan x="656" dy="15">without a second read model.</tspan></text>
