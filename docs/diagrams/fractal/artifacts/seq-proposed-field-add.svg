        <text x="78" y="922" text-anchor="start" font-size="15" fill="#243b34"><tspan x="78" dy="0">3. Read it back</tspan></text>
        
        <text x="1500" y="920.5" text-anchor="end" font-size="11" fill="#78867c">4 interactions</text>
      </g><g data-row-id="list-cmd" data-message-ids="list-cmd" data-participant-ids="shell,cli" data-row-type="message" data-kind="call">
