  </g><g data-row-id="register" data-message-ids="field-add,field-post,field-check,field-store" data-participant-ids="shell,cli,api,registry,repo" data-row-type="phase" data-phase-depth="0" data-collapsed="false">
        <rect x="58" y="118" width="1484" height="35" rx="10" fill="#f4f6f3" stroke="#d9e0da"/>
        <text x="78" y="141" text-anchor="start" font-size="15" fill="#243b34"><tspan x="78" dy="0">1. Register the field</tspan></text>
        <text x="261.62" y="141" text-anchor="start" font-size="11" fill="#78867c"><tspan x="261.62" dy="0">Owner user, so the API may create and delete it; core and provider fields are not editable this way.</tspan></text>
        <text x="1500" y="139.5" text-anchor="end" font-size="11" fill="#78867c">4 interactions</text>
      </g><g data-row-id="field-add" data-message-ids="field-add" data-participant-ids="shell,cli" data-row-type="message" data-kind="call">
