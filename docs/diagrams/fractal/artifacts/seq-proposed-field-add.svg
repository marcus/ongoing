  <g font-family="Arial, Helvetica, sans-serif" data-export-layer="title">
    <text x="70" y="43" font-size="11" letter-spacing="2.5" fill="#607c69">FRACTAL / SEQUENCE JOURNEY</text>
    <text x="70" y="88" text-anchor="start" font-size="34" fill="#243b34"><tspan x="70" dy="0">Adding a field is a row, not a migration</tspan></text>
    <text x="70" y="126" text-anchor="start" font-size="15" fill="#6e7d72"><tspan x="70" dy="0">A user field registered from the shell is immediately valid to set on an entry and visible everywhere the catalog is read — no schema change, no frontend change. Filtering on it by name arrives with</tspan><tspan x="70" dy="19">the query grammar in Phase 2.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" transform="translate(504.56928838951313 190.00000000000006) scale(0.5692883895131086)"><g data-column="shell" data-members="shell" data-elements="">
