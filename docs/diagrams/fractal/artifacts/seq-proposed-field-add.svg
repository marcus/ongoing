        <text x="78" y="476" text-anchor="start" font-size="15" fill="#243b34"><tspan x="78" dy="0">2. Set it on an entry</tspan></text>
        <text x="262.28000000000003" y="476" text-anchor="start" font-size="11" fill="#78867c"><tspan x="262.28000000000003" dy="0">The same path a core field takes. There is no second write route for user fields.</tspan></text>
        <text x="1500" y="474.5" text-anchor="end" font-size="11" fill="#78867c">5 interactions</text>
      </g><g data-row-id="set-cmd" data-message-ids="set-cmd" data-participant-ids="shell,cli" data-row-type="message" data-kind="call">
      <rect x="188" y="502" width="360" height="34" rx="7" fill="#fafbf8"/>
      <text x="368" y="525" text-anchor="middle" font-size="13" fill="#66766d"><tspan x="368" dy="0">ongoing set acme-site x.customer acme</tspan></text>
      
      <path d="M224 541H504" fill="none" stroke="#84948b" stroke-width="2" marker-end="url(#arrow)"/>
    </g><g data-row-id="set-patch" data-message-ids="set-patch" data-participant-ids="cli,api" data-row-type="message" data-kind="call">
      <rect x="476" y="566" width="360" height="49" rx="7" fill="#fafbf8"/>
      <text x="656" y="589" text-anchor="middle" font-size="13" fill="#66766d"><tspan x="656" dy="0">PATCH /api/entries/project/acme-site {</tspan><tspan x="656" dy="17">&quot;x.customer&quot;: &quot;acme&quot; }</tspan></text>
      
      <path d="M512 620H792" fill="none" stroke="#84948b" stroke-width="2" marker-end="url(#arrow)"/>
    </g><g data-row-id="set-validate" data-message-ids="set-validate" data-participant-ids="api,registry" data-row-type="message" data-kind="call">
      <rect x="764" y="645" width="360" height="96" rx="7" fill="#fafbf8"/>
      <text x="944" y="668" text-anchor="middle" font-size="13" fill="#66766d"><tspan x="944" dy="0">validateEntryPatch(registry, &apos;project&apos;, patch)</tspan></text>
      <text x="944" y="690" text-anchor="middle" font-size="11" fill="#78867c"><tspan x="944" dy="0">The CLI runs this identical pure function before sending,</tspan><tspan x="944" dy="15">and the browser will too, so a bad value never leaves the</tspan><tspan x="944" dy="15">client. An unknown key comes back naming the closest</tspan><tspan x="944" dy="15">registered field.</tspan></text>
      <path d="M800 746H1080" fill="none" stroke="#84948b" stroke-width="2" marker-end="url(#arrow)"/>
