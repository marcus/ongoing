<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="sequence-title sequence-description" data-theme="grove" data-theme-appearance="light">
  <title id="sequence-title">Adding a field is a row, not a migration</title><desc id="sequence-description">A user field registered from the shell is immediately valid to set on an entry and visible everywhere the catalog is read — no schema change, no frontend change. Filtering on it by name arrives with the query grammar in Phase 2.</desc><metadata>{&quot;journeyId&quot;:&quot;proposed-field-add&quot;,&quot;provenance&quot;:&quot;Authored 2026-09-11 from docs/plans/active/ongoing-inventory-redesign.md and ADRs 0005 and 0006; rewritten the same day against the shipped Phase 1 code (bin/ongoing.ts, src/routes/api/fields/+server.ts, src/routes/api/entries, src/lib/domain/fields.ts) and exercised end to end in tests/e2e/entries.test.ts.&quot;,&quot;hiddenLanes&quot;:[],&quot;rows&quot;:[{&quot;id&quot;:&quot;register&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;field-add&quot;,&quot;field-post&quot;,&quot;field-check&quot;,&quot;field-store&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;,&quot;api&quot;,&quot;registry&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;field-add&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;field-add&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;]},{&quot;id&quot;:&quot;field-post&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;field-post&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;cli&quot;,&quot;api&quot;]},{&quot;id&quot;:&quot;field-check&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;field-check&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;api&quot;,&quot;registry&quot;]},{&quot;id&quot;:&quot;field-store&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;field-store&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;api&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;assign&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;set-cmd&quot;,&quot;set-patch&quot;,&quot;set-validate&quot;,&quot;set-write&quot;,&quot;set-ok&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;,&quot;api&quot;,&quot;registry&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;set-cmd&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;set-cmd&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;]},{&quot;id&quot;:&quot;set-patch&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;set-patch&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;cli&quot;,&quot;api&quot;]},{&quot;id&quot;:&quot;set-validate&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;set-validate&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;api&quot;,&quot;registry&quot;]},{&quot;id&quot;:&quot;set-write&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;set-write&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;api&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;set-ok&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;set-ok&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;api&quot;,&quot;cli&quot;]},{&quot;id&quot;:&quot;use&quot;,&quot;type&quot;:&quot;phase&quot;,&quot;messageIds&quot;:[&quot;list-cmd&quot;,&quot;list-get&quot;,&quot;list-read&quot;,&quot;list-rows&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;,&quot;api&quot;,&quot;repo&quot;]},{&quot;id&quot;:&quot;list-cmd&quot;,&quot;type&quot;:&quot;message&quot;,&quot;messageIds&quot;:[&quot;list-cmd&quot;],&quot;hiddenMessageIds&quot;:[],&quot;participantIds&quot;:[&quot;shell&quot;,&quot;cli&quot;]},{&quot;id&quot;:&quot