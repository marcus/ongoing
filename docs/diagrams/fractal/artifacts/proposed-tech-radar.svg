      <g transform="translate(249.3 297) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Proposed component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="312" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">tech-signatures</tspan><tspan x="70" dy="20">provider</tspan></text>
      <text x="70" y="357" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Matches manifest</tspan><tspan x="70" dy="17">dependencies against a</tspan><tspan x="70" dy="17">signature list inside the</tspan><tspan x="70" dy="17">stack collector parse pass;</tspan><tspan x="70" dy="17">languages come from</tspan><tspan x="70" dy="17">project_stacks. Detected</tspan><tspan x="70" dy="17">uses relations are rewritten</tspan><tspan x="70" dy="17">every scan and never</tspan><tspan x="70" dy="17">hand-edited.</tspan></text>
      </g><g data-element="radar.tech_cli"><rect x="56.64999999999998" y="543" width="212" height="180" rx="14" fill="#ffffff" stroke="#C4A0B8" stroke-width="1.3" stroke-dasharray="6 4"/>
      <g transform="translate(242.65 560) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Proposed component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="76.65" y="575" font-size="14" font-weight="600" fill="#292927"><tspan x="76.65" dy="0">ongoing tech</tspan><tspan x="76.65" dy="20">verbs</tspan></text>
      <text x="76.65" y="620" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="76.65" dy="0">tech list, show, add, set,</tspan><tspan x="76.65" dy="17">export: the CLI and JSON</tspan><tspan x="76.65" dy="17">surface that regenerates</tspan><tspan x="76.65" dy="17">the project-standards</tspan><tspan x="76.65" dy="17">language and tool-surface</tspan><tspan x="76.65" dy="17">tables.</tspan></text>
      </g><g data-element="radar.page"><rect x="56.64999999999998" y="89" width="212" height="159" rx="14" fill="#ffffff" stroke="#C4A0B8" stroke-width="1.3" stroke-dasharray="6 4"/>
      <g transform="translate(242.65 106) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Proposed component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="76.65" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="76.65" dy="0">Radar page</tspan></text>
      <text x="76.65" y="145" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="76.65" dy="0">Four rings as rows, each</tspan><tspan x="76.65" dy="17">technology a chip with its</tspan><tspan x="76.65" dy="17">project count, clicking</tspan><tspan x="76.65" dy="17">through to the inventory</tspan><tspan x="76.65" dy="17">filtered by that technology.</tspan><tspan x="76.65" dy="17">Ring editable on the chip.</tspan></text>
      </g></g>
