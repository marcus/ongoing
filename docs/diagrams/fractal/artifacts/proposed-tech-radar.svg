  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Ongoing / Proposal: technologies and the radar</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Phase 3: a second entry kind with rings, uses relations detected by a tech-signatures provider, and ongoing tech verbs that regenerate the project-standards tables. Its links</tspan><tspan x="96" dy="26">into the entries, the registry, and the scanner are drawn in the inventory proposal scene.</tspan></text></g>
