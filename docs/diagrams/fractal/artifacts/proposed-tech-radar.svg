  <title id="title">Ongoing / Proposal: technologies and the radar</title><desc id="description">Phase 3: a second entry kind with rings, uses relations detected by a tech-signatures provider, and ongoing tech verbs that regenerate the project-standards tables. Its links into the entries, the registry, and the scanner are drawn in the inventory proposal scene.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
