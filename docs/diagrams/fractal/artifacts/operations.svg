<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="grove" data-theme-appearance="light">
  <title id="title">Ongoing / Running on aerie.local</title><desc id="description">Immutable builds keep live routes safe; the calendar requests scans from the deployed web service.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84948b"/></marker></defs>
  <rect width="1920" height="1080" fill="#fafbf8"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#607c69">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#243b34"><tspan x="96" dy="0">Ongoing / Running on aerie.local</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#6e7d72"><tspan x="96" dy="0">Immutable builds keep live routes safe; the calendar requests scans from the deployed web service.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(696.575 210) scale(0.713)"><g data-element="ops"><rect x="25" y="24" width="688.8399999999999" height="1015" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(687.84 41) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#243b34"><tspan x="49" dy="0">Release &amp; operations</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><path d="M267.06,744.5 L475.84,744.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="ops.scan_job"><rect x="52.02999999999999" y="109" width="212" height="227" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(238.03 126) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Job</title><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.5"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.5v6l4 2.5"/></g>
      <text x="72.03" y="141" font-size="14" font-weight="600" fill="#243b34"><tspan x="72.03" dy="0">Daily scan entry</tspan></text>
      <text x="72.03" y="165" font-size="12" font-weight="400" fill="#67746e"><tspan x="72.03" dy="0">scripts/scan.ts forces</tspan><tspan x="72.03" dy="17">HTTP transport through the</tspan><tspan x="72.03" dy="17">CLI, requests the deployed</tspan><tspan x="72.03" dy="17">scanner, and waits for its</tspan><tspan x="72.03" dy="17">exact run ID. No local</tspan><tspan x="72.03" dy="17">catalog fallback or source</tspan><tspan x="72.03" dy="17">migrations; unavailable</tspan><tspan x="72.03" dy="17">service, lease conflicts,</tspan><tspan x="72.03" dy="17">and failed runs exit</tspan><tspan x="72.03" dy="17">nonzero.</tspan></text>
      </g><g data-element="ops.build"><rect x="50" y="368" width="216.05999999999997" height="248" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(240.06 385) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="400" font-size="14" font-weight="600" fill="#243b34"><tspan x="70" dy="0">Immutable build</tspan><tspan x="70" dy="20">publisher</tspan></text>
      <text x="70" y="445" font-size="12" font-weight="400" fill="#67746e"><tspan x="70" dy="0">Stages adapter-node in a</tspan><tspan x="70" dy="17">unique directory, serializes</tspan><tspan x="70" dy="17">Vite builds, and atomically</tspan><tspan x="70" dy="17">selects only successful</tspan><tspan x="70" dy="17">bundles through the build</tspan><tspan x="70" dy="17">symlink. Retains old</tspan><tspan x="70" dy="17">artifacts for live</tspan><tspan x="70" dy="17">processes; legacy directory</tspan><tspan x="70" dy="17">installations require explicit</tspan><tspan x="70" dy="17">adoption while stopped.</tspan></text>
      </g><g data-element="ops.release"><rect x="54.059999999999974" y="648" width="212" height="193" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(240.06 665) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="74.06" y="680" font-size="14" font-weight="600" fill="#243b34"><tspan x="74.06" dy="0">Deploy &amp; rollback</tspan></text>
      <text x="74.06" y="704" font-size="12" font-weight="400" fill="#67746e"><tspan x="74.06" dy="0">Client validates the pinned</tspan><tspan x="74.06" dy="17">runtime, then the remote</tspan><tspan x="74.06" dy="17">worker fast-forwards main,</tspan><tspan x="74.06" dy="17">quiesces both agents, backs</tspan><tspan x="74.06" dy="17">up SQLite, builds, migrates</tspan><tspan x="74.06" dy="17">once, reinstalls definitions,</tspan><tspan x="74.06" dy="17">and waits for health on</tspan><tspan x="74.06" dy="17">7766.</tspan></text>
      </g><g data-element="ops.smoke"><rect x="52.02999999999999" y="873" width="212" height="142" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(238.03 890) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="72.03" y="905" font-size="14" font-weight="600" fill="#243b34"><tspan x="72.03" dy="0">Smoke &amp; migrate</tspan></text>
      <text x="72.03" y="929" font-size="12" font-weight="400" fill="#67746e"><tspan x="72.03" dy="0">Authenticated LAN smoke</tspan><tspan x="72.03" dy="17">against the configured</tspan><tspan x="72.03" dy="17">origin, production-server</tspan><tspan x="72.03" dy="17">tests, and the standalone</tspan><tspan x="72.03" dy="17">migration runner.</tspan></text>
      </g><g data-element="ops.provision"><rect x="476.8399999999999" y="671.5" width="212" height="146" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(662.84 688.5) scale(0.667)" color="#9FA8B3" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="496.84" y="703.5" font-size="14" font-weight="600" fill="#243b34"><tspan x="496.84" dy="0">Runtime</tspan><tspan x="496.84" dy="20">provisioning</tspan></text>
      <text x="496.84" y="748.5" font-size="12" font-weight="400" fill="#67746e"><tspan x="496.84" dy="0">Installs the exact Bun</tspan><tspan x="496.84" dy="17">version into an app-scoped</tspan><tspan x="496.84" dy="17">mise data directory without</tspan><tspan x="496.84" dy="17">touching the user runtime.</tspan></text>
      </g><g><rect x="315.05999999999995" y="750.5" width="112.77999999999997" height="53" rx="5" fill="#fafbf8"/><text x="371.44999999999993" y="763.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="371.44999999999993" dy="0">Validates the</tspan><tspan x="371.44999999999993" dy="15">pinned Bun before</tspan><tspan x="371.44999999999993" dy="15">deploying</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#dce2db"/><text x="96" y="1044" font-size="13" fill="#78867c">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#78867c">FOCUS: Release &amp; operations · 8 external connections outside view</text></g></svg>
