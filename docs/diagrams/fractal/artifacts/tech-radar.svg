<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Ongoing / The tech radar</title><desc id="description">Technologies as a second entry kind with rings, uses relations detected by the tech-signatures provider inside the stack collector pass or declared by hand, ongoing tech verbs over the same query model, and the generator that renders the project-standards tables. Only the radar page is still a proposal.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#85857f"/></marker></defs>
  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Ongoing / The tech radar</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">Technologies as a second entry kind with rings, uses relations detected by the tech-signatures provider inside the stack collector pass or declared by hand, ongoing tech verbs</tspan><tspan x="96" dy="26">over the same query model, and the generator that renders the project-standards tables. Only the radar page is still a proposal.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(553.398 236) scale(1.022)"><g data-element="radar"><rect x="25" y="24" width="745.43" height="668" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(744.43 41) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#292927"><tspan x="49" dy="0">Tech radar</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M307,238.5 L525.57,238.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M307,535.5 L525.57,535.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="radar.model"><rect x="526.5699999999999" y="106" width="218.85999999999999" height="265" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(719.43 123) scale(0.667)" color="#89A579" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="546.57" y="138" font-size="14" font-weight="600" fill="#292927"><tspan x="546.57" dy="0">Radar model &amp;</tspan><tspan x="546.57" dy="20">signatures</tspan></text>
      <text x="546.57" y="183" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="546.57" dy="0">The seed list Ongoing ships,</tspan><tspan x="546.57" dy="17">the signature table that is</tspan><tspan x="546.57" dy="17">the whole detector, the</tspan><tspan x="546.57" dy="17">matchers over one manifest,</tspan><tspan x="546.57" dy="17">the ring vocabulary and</tspan><tspan x="546.57" dy="17">staleness rule, and the</tspan><tspan x="546.57" dy="17">deterministic export. Pure</tspan><tspan x="546.57" dy="17">data and pure rules; a</tspan><tspan x="546.57" dy="17">signature exists only for a</tspan><tspan x="546.57" dy="17">technology already in the</tspan><tspan x="546.57" dy="17">catalog.</tspan></text>
      </g><g data-element="radar.signatures"><rect x="80.70000000000005" y="89" width="225.29999999999995" height="299" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(280 106) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="100.7" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="100.7" dy="0">tech-signatures</tspan><tspan x="100.7" dy="20">provider</tspan></text>
      <text x="100.7" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="100.7" dy="0">Matches manifest</tspan><tspan x="100.7" dy="17">dependencies against the</tspan><tspan x="100.7" dy="17">signature list inside the</tspan><tspan x="100.7" dy="17">stack collector parse pass —</tspan><tspan x="100.7" dy="17">package.json, go.mod, Gemfile,</tspan><tspan x="100.7" dy="17">Cargo.toml, composer.json,</tspan><tspan x="100.7" dy="17">plus marker files — and takes</tspan><tspan x="100.7" dy="17">languages from the toolchains</tspan><tspan x="100.7" dy="17">the same pass collected.</tspan><tspan x="100.7" dy="17">Detected uses relations are</tspan><tspan x="100.7" dy="17">rewritten whole every scan</tspan><tspan x="100.7" dy="17">and never hand-edited;</tspan><tspan x="100.7" dy="17">declared edges are untouched.</tspan></text>
      </g><g data-element="radar.tech_cli"><rect x="526.5699999999999" y="403" width="212" height="265" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(712.57 420) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="546.57" y="435" font-size="14" font-weight="600" fill="#292927"><tspan x="546.57" dy="0">ongoing tech</tspan><tspan x="546.57" dy="20">verbs</tspan></text>
      <text x="546.57" y="480" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="546.57" dy="0">tech list, show, add, set,</tspan><tspan x="546.57" dy="17">export, and an idempotent</tspan><tspan x="546.57" dy="17">seed that writes the</tspan><tspan x="546.57" dy="17">shipped technologies</tspan><tspan x="546.57" dy="17">through the API rather than</tspan><tspan x="546.57" dy="17">a migration. Every flag is a</tspan><tspan x="546.57" dy="17">clause against the same</tspan><tspan x="546.57" dy="17">query model, so tech list</tspan><tspan x="546.57" dy="17">--ring hot is list</tspan><tspan x="546.57" dy="17">kind:technology ring:hot in</tspan><tspan x="546.57" dy="17">ring order.</tspan></text>
      </g><g data-element="radar.generator"><rect x="50" y="445.5" width="256" height="180" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(280 462.5) scale(0.667)" color="#C4A0B8" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="477.5" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">project-standards</tspan><tspan x="70" dy="20">generator</tspan></text>
      <text x="70" y="522.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Renders ongoing tech export into</tspan><tspan x="70" dy="17">the skill&apos;s language and</tspan><tspan x="70" dy="17">tool-surface tables between</tspan><tspan x="70" dy="17">markers, leaving the prose around</tspan><tspan x="70" dy="17">them alone. --check fails when the</tspan><tspan x="70" dy="17">skill has drifted from the catalog.</tspan></text>
      </g><g><rect x="355" y="198.5" width="122.56999999999995" height="38" rx="5" fill="#f8f8f6"/><text x="416.28499999999997" y="211.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="416.28499999999997" dy="0">Matches against</tspan><tspan x="416.28499999999997" dy="15">the signature table</tspan></text></g><g><rect x="358.245" y="541.5" width="116.07999999999997" height="53" rx="5" fill="#f8f8f6"/><text x="416.28499999999997" y="554.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="416.28499999999997" dy="0">Reads the</tspan><tspan x="416.28499999999997" dy="15">deterministic tech</tspan><tspan x="416.28499999999997" dy="15">export</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#ddddda"/><text x="96" y="1044" font-size="13" fill="#7d7d77">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#7d7d77">FOCUS: Tech radar · 6 external connections outside view</text></g></svg>
