<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="grove" data-theme-appearance="light">
  <title id="title">Ongoing / Entries, fields, and relations</title><desc id="description">What Phase 1 built: one entries table with a source per provider, a registry that validates every patch, and one API and CLI over both. The project dashboard is a projection of the same rows.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84948b"/></marker></defs>
  <rect width="1920" height="1080" fill="#fafbf8"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#607c69">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#243b34"><tspan x="96" dy="0">Ongoing / Entries, fields, and relations</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#6e7d72"><tspan x="96" dy="0">What Phase 1 built: one entries table with a source per provider, a registry that validates every patch, and one API and CLI over both. The project dashboard is a projection of</tspan><tspan x="96" dy="26">the same rows.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(96 358.052) scale(1.07)"><g data-element="inventory"><rect x="25" y="24" width="1565.0299999999997" height="408" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1564.03 41) scale(0.667)" color="#7FA8C9" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#243b34"><tspan x="49" dy="0">Software inventory</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><path d="M263,258.5 L469.25,258.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M683.25,258.5 L900.61,258.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1131.41,258.5 L1343.49,258.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="inventory.entries"><rect x="1344.4899999999998" y="109" width="220.53999999999996" height="299" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1539.03 126) scale(0.667)" color="#7FA8C9" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="1364.49" y="141" font-size="14" font-weight="600" fill="#243b34"><tspan x="1364.49" dy="0">entries, fields,</tspan><tspan x="1364.49" dy="20">relations</tspan></text>
      <text x="1364.49" y="186" font-size="12" font-weight="400" fill="#67746e"><tspan x="1364.49" dy="0">entries (kind, slug, tags,</tspan><tspan x="1364.49" dy="17">attributes JSON),</tspan><tspan x="1364.49" dy="17">entry_sources (which</tspan><tspan x="1364.49" dy="17">provider found it, and where</tspan><tspan x="1364.49" dy="17">— the filesystem provider</tspan><tspan x="1364.49" dy="17">writes the canonical path),</tspan><tspan x="1364.49" dy="17">fields (user-defined),</tspan><tspan x="1364.49" dy="17">relations (uses, provides,</tspan><tspan x="1364.49" dy="17">depends_on, part_of, with</tspan><tspan x="1364.49" dy="17">declared or detected</tspan><tspan x="1364.49" dy="17">evidence), saved_views.</tspan><tspan x="1364.49" dy="17">Projects and technologies</tspan><tspan x="1364.49" dy="17">are rows of one table.</tspan></text>
      </g><g data-element="inventory.registry"><rect x="901.6099999999999" y="126" width="228.79999999999993" height="265" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1104.41 143) scale(0.667)" color="#89A579" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="921.61" y="158" font-size="14" font-weight="600" fill="#243b34"><tspan x="921.61" dy="0">Field registry &amp;</tspan><tspan x="921.61" dy="20">validation</tspan></text>
      <text x="921.61" y="203" font-size="12" font-weight="400" fill="#67746e"><tspan x="921.61" dy="0">Built-in fields declared in</tspan><tspan x="921.61" dy="17">code, user fields as rows,</tspan><tspan x="921.61" dy="17">provider fields projected from</tspan><tspan x="921.61" dy="17">the metric tables as</tspan><tspan x="921.61" dy="17">namespaced read-only keys.</tspan><tspan x="921.61" dy="17">validateEntryPatch(registry,</tspan><tspan x="921.61" dy="17">kind, patch) is the one pure</tspan><tspan x="921.61" dy="17">validation path the API, the</tspan><tspan x="921.61" dy="17">CLI, and the browser all run; an</tspan><tspan x="921.61" dy="17">unknown key names the closest</tspan><tspan x="921.61" dy="17">registered field.</tspan></text>
      </g><g data-element="inventory.entries_api"><rect x="470.25" y="111" width="212" height="295" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(656.25 128) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="490.25" y="143" font-size="14" font-weight="600" fill="#243b34"><tspan x="490.25" dy="0">Entries API</tspan></text>
      <text x="490.25" y="167" font-size="12" font-weight="400" fill="#67746e"><tspan x="490.25" dy="0">GET/POST /api/entries and</tspan><tspan x="490.25" dy="17">GET/PATCH/DELETE</tspan><tspan x="490.25" dy="17">/api/entries/:kind/:slug,</tspan><tspan x="490.25" dy="17">plus /api/fields,</tspan><tspan x="490.25" dy="17">/api/relations, and</tspan><tspan x="490.25" dy="17">/api/views. One flat patch</tspan><tspan x="490.25" dy="17">of field keys per write,</tspan><tspan x="490.25" dy="17">validated by the registry.</tspan><tspan x="490.25" dy="17">/api/projects survives as</tspan><tspan x="490.25" dy="17">the project projection of</tspan><tspan x="490.25" dy="17">the same entries until the</tspan><tspan x="490.25" dy="17">new shell ships; q, sort,</tspan><tspan x="490.25" dy="17">columns and saved arrive</tspan><tspan x="490.25" dy="17">with the query grammar.</tspan></text>
      </g><g data-element="inventory.entry_cli"><rect x="50" y="119.5" width="212" height="278" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(236 136.5) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="151.5" font-size="14" font-weight="600" fill="#243b34"><tspan x="70" dy="0">Entry CLI verbs</tspan></text>
      <text x="70" y="175.5" font-size="12" font-weight="400" fill="#67746e"><tspan x="70" dy="0">get, set &lt;entry&gt; &lt;field&gt;</tspan><tspan x="70" dy="17">&lt;value&gt; with the original</tspan><tspan x="70" dy="17">decision flags as aliases,</tspan><tspan x="70" dy="17">entry add|list|remove, field</tspan><tspan x="70" dy="17">list|add|remove, tag, untag,</tspan><tspan x="70" dy="17">link, unlink, and view</tspan><tspan x="70" dy="17">save|list|delete. The CLI</tspan><tspan x="70" dy="17">imports the domain registry</tspan><tspan x="70" dy="17">directly, so a bad value is</tspan><tspan x="70" dy="17">refused before the round</tspan><tspan x="70" dy="17">trip. A transport adapter</tspan><tspan x="70" dy="17">and the query-model list</tspan><tspan x="70" dy="17">arrive in later phases.</tspan></text>
      </g><g><rect x="311" y="264.5" width="110.24999999999997" height="68" rx="5" fill="#fafbf8"/><text x="366.125" y="277.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="366.125" dy="0">Over HTTP, or the</tspan><tspan x="366.125" dy="15">core in-process</tspan><tspan x="366.125" dy="15">when no service</tspan><tspan x="366.125" dy="15">runs</tspan></text></g><g><rect x="731.25" y="264.5" width="121.35999999999996" height="38" rx="5" fill="#fafbf8"/><text x="791.93" y="277.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="791.93" dy="0">validateEntryPatch</tspan><tspan x="791.93" dy="15">before any write</tspan></text></g><g><rect x="1179.4099999999999" y="264.5" width="116.07999999999997" height="38" rx="5" fill="#fafbf8"/><text x="1237.4499999999998" y="277.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="1237.4499999999998" dy="0">User-defined field</tspan><tspan x="1237.4499999999998" dy="15">rows</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#dce2db"/><text x="96" y="1044" font-size="13" fill="#78867c">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#78867c">FOCUS: Software inventory · 5 external connections outside view</text></g></svg>
