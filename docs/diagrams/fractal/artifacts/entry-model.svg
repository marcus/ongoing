<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="grove" data-theme-appearance="light">
  <title id="title">Ongoing / Entries, fields, and relations</title><desc id="description">What Phases 1 and 2 built: one entries table with a source per provider, a registry that validates every patch, one query grammar that reads them all, and one API and CLI over the lot. The project dashboard is a projection of the same rows.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84948b"/></marker></defs>
  <rect width="1920" height="1080" fill="#fafbf8"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#607c69">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#243b34"><tspan x="96" dy="0">Ongoing / Entries, fields, and relations</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#6e7d72"><tspan x="96" dy="0">What Phases 1 and 2 built: one entries table with a source per provider, a registry that validates every patch, one query grammar that reads them all, and one API and CLI over the</tspan><tspan x="96" dy="26">lot. The project dashboard is a projection of the same rows.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(96 290.196) scale(0.849)"><g data-element="inventory"><rect x="25" y="24" width="1985.2799999999997" height="686.5" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1984.28 41) scale(0.667)" color="#7FA8C9" opacity="0.85"><title>Subsystem</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2"/></g></g>
      <text x="49" y="54" font-size="14" font-weight="600" fill="#243b34"><tspan x="49" dy="0">Software inventory</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><path d="M263,307.5 L279,307.5 L279,513.5 L469.25,513.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,307.5 L892.8,307.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M683.25,513.5 L699.25,513.5 L699.25,588.5 L1288.86,588.5 L1288.86,307.5 L1320.86,307.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M683.25,513.5 L860.8,513.5 L860.8,307.5 L892.8,307.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1106.8,307.5 L1320.86,307.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1551.66,307.5 L1763.74,307.5" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="inventory.entries"><rect x="1764.7399999999998" y="158" width="220.53999999999996" height="299" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1959.28 175) scale(0.667)" color="#7FA8C9" opacity="0.85"><title>Store</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></g></g>
      <text x="1784.74" y="190" font-size="14" font-weight="600" fill="#243b34"><tspan x="1784.74" dy="0">entries, fields,</tspan><tspan x="1784.74" dy="20">relations</tspan></text>
      <text x="1784.74" y="235" font-size="12" font-weight="400" fill="#67746e"><tspan x="1784.74" dy="0">entries (kind, slug, tags,</tspan><tspan x="1784.74" dy="17">attributes JSON),</tspan><tspan x="1784.74" dy="17">entry_sources (which</tspan><tspan x="1784.74" dy="17">provider found it, and where</tspan><tspan x="1784.74" dy="17">— the filesystem provider</tspan><tspan x="1784.74" dy="17">writes the canonical path),</tspan><tspan x="1784.74" dy="17">fields (user-defined),</tspan><tspan x="1784.74" dy="17">relations (uses, provides,</tspan><tspan x="1784.74" dy="17">depends_on, part_of, with</tspan><tspan x="1784.74" dy="17">declared or detected</tspan><tspan x="1784.74" dy="17">evidence), saved_views.</tspan><tspan x="1784.74" dy="17">Projects and technologies</tspan><tspan x="1784.74" dy="17">are rows of one table.</tspan></text>
      </g><g data-element="inventory.registry"><rect x="1321.86" y="175" width="228.79999999999993" height="265" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1524.66 192) scale(0.667)" color="#89A579" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="1341.86" y="207" font-size="14" font-weight="600" fill="#243b34"><tspan x="1341.86" dy="0">Field registry &amp;</tspan><tspan x="1341.86" dy="20">validation</tspan></text>
      <text x="1341.86" y="252" font-size="12" font-weight="400" fill="#67746e"><tspan x="1341.86" dy="0">Built-in fields declared in</tspan><tspan x="1341.86" dy="17">code, user fields as rows,</tspan><tspan x="1341.86" dy="17">provider fields projected from</tspan><tspan x="1341.86" dy="17">the metric tables as</tspan><tspan x="1341.86" dy="17">namespaced read-only keys.</tspan><tspan x="1341.86" dy="17">validateEntryPatch(registry,</tspan><tspan x="1341.86" dy="17">kind, patch) is the one pure</tspan><tspan x="1341.86" dy="17">validation path the API, the</tspan><tspan x="1341.86" dy="17">CLI, and the browser all run; an</tspan><tspan x="1341.86" dy="17">unknown key names the closest</tspan><tspan x="1341.86" dy="17">registered field.</tspan></text>
      </g><g data-element="inventory.query"><rect x="893.8" y="109" width="212" height="397" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(1079.8 126) scale(0.667)" color="#89A579" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="913.8" y="141" font-size="14" font-weight="600" fill="#243b34"><tspan x="913.8" dy="0">Query grammar</tspan></text>
      <text x="913.8" y="165" font-size="12" font-weight="400" fill="#67746e"><tspan x="913.8" dy="0">One pure parser and</tspan><tspan x="913.8" dy="17">evaluator for filter</tspan><tspan x="913.8" dy="17">clauses, multi-key sorts,</tspan><tspan x="913.8" dy="17">and column sets. Parsing is</tspan><tspan x="913.8" dy="17">total; unknown keys error</tspan><tspan x="913.8" dy="17">against the registry with</tspan><tspan x="913.8" dy="17">the nearest registered</tspan><tspan x="913.8" dy="17">field. tag:, view:, tech: and</tspan><tspan x="913.8" dy="17">kind: are field clauses like</tspan><tspan x="913.8" dy="17">any other, because the read</tspan><tspan x="913.8" dy="17">model derives path,</tspan><tspan x="913.8" dy="17">is_missing, views, warnings,</tspan><tspan x="913.8" dy="17">tech and stack.lag. The</tspan><tspan x="913.8" dy="17">pre-Phase-2 view, filter,</tspan><tspan x="913.8" dy="17">stack and search</tspan><tspan x="913.8" dy="17">parameters translate into</tspan><tspan x="913.8" dy="17">clauses through one</tspan><tspan x="913.8" dy="17">exported table. A saved view</tspan><tspan x="913.8" dy="17">is the same string stored,</tspan><tspan x="913.8" dy="17">and views ship built in.</tspan></text>
      </g><g data-element="inventory.entries_api"><rect x="470.25" y="340.5" width="212" height="346" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(656.25 357.5) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="490.25" y="372.5" font-size="14" font-weight="600" fill="#243b34"><tspan x="490.25" dy="0">Entries API</tspan></text>
      <text x="490.25" y="396.5" font-size="12" font-weight="400" fill="#67746e"><tspan x="490.25" dy="0">GET</tspan><tspan x="490.25" dy="17">/api/entries?q=&amp;sort=&amp;colu</tspan><tspan x="490.25" dy="17">mns=&amp;saved= is the one read</tspan><tspan x="490.25" dy="17">endpoint; GET/PATCH/DELETE</tspan><tspan x="490.25" dy="17">/api/entries/:kind/:slug,</tspan><tspan x="490.25" dy="17">POST /api/entries,</tspan><tspan x="490.25" dy="17">/api/fields, /api/relations</tspan><tspan x="490.25" dy="17">and /api/views are the rest.</tspan><tspan x="490.25" dy="17">One flat patch of field keys</tspan><tspan x="490.25" dy="17">per write, validated by the</tspan><tspan x="490.25" dy="17">registry; one query string</tspan><tspan x="490.25" dy="17">per read, parsed by the</tspan><tspan x="490.25" dy="17">grammar. /api/projects</tspan><tspan x="490.25" dy="17">survives as the project</tspan><tspan x="490.25" dy="17">projection of the same</tspan><tspan x="490.25" dy="17">entries until the new shell</tspan><tspan x="490.25" dy="17">ships.</tspan></text>
      </g><g data-element="inventory.entry_cli"><rect x="50" y="126" width="212" height="363" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(236 143) scale(0.667)" color="#82A6B6" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="158" font-size="14" font-weight="600" fill="#243b34"><tspan x="70" dy="0">Entry CLI verbs</tspan></text>
      <text x="70" y="182" font-size="12" font-weight="400" fill="#67746e"><tspan x="70" dy="0">list with a query string,</tspan><tspan x="70" dy="17">--sort, --columns, --saved</tspan><tspan x="70" dy="17">and --count; views and</tspan><tspan x="70" dy="17">stacks over the same</tspan><tspan x="70" dy="17">endpoint; get, set &lt;entry&gt;</tspan><tspan x="70" dy="17">&lt;field&gt; &lt;value&gt; with the</tspan><tspan x="70" dy="17">original decision flags as</tspan><tspan x="70" dy="17">aliases; entry, field, tag,</tspan><tspan x="70" dy="17">untag, link, unlink, view. The</tspan><tspan x="70" dy="17">CLI imports the domain</tspan><tspan x="70" dy="17">registry and the query</tspan><tspan x="70" dy="17">parser directly, so a bad</tspan><tspan x="70" dy="17">value or a bad clause is</tspan><tspan x="70" dy="17">refused before the round</tspan><tspan x="70" dy="17">trip, and every flag it</tspan><tspan x="70" dy="17">shipped with survives as a</tspan><tspan x="70" dy="17">clause alias. A transport</tspan><tspan x="70" dy="17">adapter arrives in Phase 5.</tspan></text>
      </g><g><rect x="311" y="519.5" width="110.24999999999997" height="68" rx="5" fill="#fafbf8"/><text x="366.125" y="532.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="366.125" dy="0">Over HTTP, or the</tspan><tspan x="366.125" dy="15">core in-process</tspan><tspan x="366.125" dy="15">when no service</tspan><tspan x="366.125" dy="15">runs</tspan></text></g><g><rect x="516.725" y="222.5" width="119.04999999999995" height="83" rx="5" fill="#fafbf8"/><text x="576.25" y="235.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="576.25" dy="0">Builds the query</tspan><tspan x="576.25" dy="15">from flags and</tspan><tspan x="576.25" dy="15">counts saved views</tspan><tspan x="576.25" dy="15">without a round</tspan><tspan x="576.25" dy="15">trip</tspan></text></g><g><rect x="939.12" y="594.5" width="121.35999999999996" height="38" rx="5" fill="#fafbf8"/><text x="999.8" y="607.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="999.8" dy="0">validateEntryPatch</tspan><tspan x="999.8" dy="15">before any write</tspan></text></g><g><rect x="731.25" y="519.5" width="113.54999999999997" height="53" rx="5" fill="#fafbf8"/><text x="788.025" y="532.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="788.025" dy="0">Parses and</tspan><tspan x="788.025" dy="15">evaluates q, sort,</tspan><tspan x="788.025" dy="15">columns, saved</tspan></text></g><g><rect x="1154.8" y="252.5" width="118.05999999999996" height="53" rx="5" fill="#fafbf8"/><text x="1213.83" y="265.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="1213.83" dy="0">Resolves and</tspan><tspan x="1213.83" dy="15">type-checks every</tspan><tspan x="1213.83" dy="15">field key</tspan></text></g><g><rect x="1599.6599999999999" y="313.5" width="116.07999999999997" height="38" rx="5" fill="#fafbf8"/><text x="1657.6999999999998" y="326.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="1657.6999999999998" dy="0">User-defined field</tspan><tspan x="1657.6999999999998" dy="15">rows</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#dce2db"/><text x="96" y="1044" font-size="13" fill="#78867c">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#78867c">FOCUS: Software inventory · 5 external connections outside view</text></g></svg>
