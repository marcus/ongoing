  --amber:#f0a63c;

  --green:#8fd06a;
  --green-dim:#4e7038;
  --red:#e5584f;
  --cyan:#5cc2d6;

html{background:var(--bg)}
body{

  font-size:12px;
  color:var(--ink);

  padding-bottom:60px;

::selection{background:var(--amber);color:var(--bg)}

/* ---------- header ---------- */
header{
  display:flex;align-items:baseline;gap:20px;
  padding:18px 24px 12px;
  border-bottom:1px solid var(--line-strong);
}
.wordmark{
  font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:30px;letter-spacing:-.5px;color:var(--amber);
  line-height:1;
}
.wordmark::after{content:".";color:var(--ink)}
.tagline{
  font-family:var(--serif);font-style:italic;font-size:14px;
  color:var(--ink-dim);
}
.scanline{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--ink-dim);font-size:11px}
.scanline b{color:var(--ink);font-weight:500}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  font-family:var(--mono);font-size:11px;color:var(--ink);
  background:var(--bg-raise);border:1px solid var(--line-strong);

}
.btn:hover{border-color:var(--amber-dim);color:var(--amber)}

/* ---------- ticker ---------- */
.ticker{
  display:flex;gap:0;border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.ticker .stat{
  padding:8px 20px;border-right:1px solid var(--line);
  color:var(--ink-dim);font-size:11px;white-space:nowrap;
}
.ticker .stat b{color:var(--ink);font-weight:600;font-size:13px;margin-right:5px}

/* ---------- attention chips ---------- */
.views{display:flex;gap:8px;padding:14px 24px 4px;flex-wrap:wrap;align-items:center}
.views .label{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-faint);margin-right:6px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  padding:5px 11px;border-radius:2px;cursor:pointer;
  border:1px solid var(--line-strong);color:var(--ink-dim);background:transparent;
}
.chip b{font-size:12px;font-weight:600}
.chip:hover{border-color:var(--ink-dim)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chip.c-dim b{color:var(--ink-faint)}
.chip.active b{color:inherit}

.sort.active{color:var(--amber);border-bottom-color:var(--amber)}

.spacer{flex:1}

.search:focus{outline:none;border-color:var(--amber-dim)}
.search::placeholder{color:var(--ink-faint)}
.toggle{font-size:11px;color:var(--ink-dim);cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center}
.toggle input{accent-color:var(--amber)}

.list{border-top:1px solid var(--line-strong)}
.colhead,.row{

  padding:0 24px;

.colhead{

}
.colhead span{cursor:default}
.num{text-align:right}
.row{

.row:hover{background:var(--bg-hover)}

.star.on{color:var(--amber)}
.star:hover{color:var(--amber)}

.proj .note{

.proj .note.empty{color:var(--ink-faint)}

.branch{font-size:11px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch .dirty{color:var(--amber)}
.branch .sync{color:var(--ink-faint);display:block;font-size:10px}

footer .right{margin-left:auto;font-family:var(--serif);font-style:italic;font-size:11px}

  : a< mo ? `${Math.round(a/d)}d` : `${Math.round(a/mo)}mo`;
const ageClass = a => a< d ? 'age-hot' : a< 7*d ? 'age-warm' : a< 45*d ? 'age-cool' : 'age-cold';
const fmtLoc = n => n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : ''+n;

function sparkSvg(data, w=84, hgt=18, color='var(--amber)'){
  const max = Math.max(...data,1), bw = w/data.length;
  let bars='';
  data.forEach((v,i)=>{
    const bh = v===0 ? 1.5 : Math.max(2,(v/max)*hgt);
    const c = v===0 ? 'var(--line-strong)' : color;
    bars+=`<rect x="${(i*bw).toFixed(1)}" y="${(hgt-bh).toFixed(1)}" width="${(bw-1.6).toFixed(1)}" height="${bh.toFixed(1)}" fill="${c}" rx="1"/>`;
  });
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}">${bars}</svg>`;
}

/* ---------------- sorts ---------------- */
const SORTS = [
  {key:'commit', label:'latest commit', fn:(a,b)=>a.age-b.age},
  {key:'c30',    label:'commits 30d',   fn:(a,b)=>b.c30-a.c30},
  {key:'loc',    label:'loc',           fn:(a,b)=>b.loc-a.loc},
  {key:'td',     label:'td open',       fn:(a,b)=>((b.td?.open??-1)-(a.td?.open??-1))},
  {key:'stars',  label:'gh stars',      fn:(a,b)=>((b.gh?.stars??-1)-(a.gh?.stars??-1))},
  {key:'delta',  label:'★ Δ30d',        fn:(a,b)=>((b.gh?.delta??-1)-(a.gh?.delta??-1))},
  {key:'prs',    label:'open prs',      fn:(a,b)=>((b.gh?.prs??-1)-(a.gh?.prs??-1))},
  {key:'name',   label:'name',          fn:(a,b)=>a.name.localeCompare(b.name)},
  {key:'manual', label:'manual',        fn:(a,b)=>0},
];
let state = {sort:'commit', view:null, q:'', favFirst:true, open:'betamax'};

const VIEWS = [
  {key:'attention', label:'NEEDS ATTENTION', cls:'c-red'},
  {key:'rising',    label:'RISING',          cls:'c-green'},
  {key:'quickwin',  label:'QUICK WINS',      cls:'c-amber'},
  {key:'opportunity',label:'OPPORTUNITY',    cls:'c-cyan'},
  {key:'momentum',  label:'MOMENTUM',        cls:'c-green'},
  {key:'dormant',   label:'DORMANT',         cls:'c-dim'},
];

/* ---------------- render ---------------- */
function ticker(){
  const t = document.getElementById('ticker');
  const totLoc = P.reduce((s,p)=>s+p.loc,0);
  const dirty = P.filter(p=>p.dirty).length;
  const wk = P.reduce((s,p)=>s+p.spark.slice(-7).reduce((x,y)=>x+y,0),0);
  const tdOpen = P.reduce((s,p)=>s+(p.td?.open??0),0);
  const stars = P.reduce((s,p)=>s+(p.gh?.stars??0),0);
  t.innerHTML = [
    ['97','repos tracked'],[fmtLoc(totLoc*4.3|0),'lines of code'],
    [wk,'commits this week'],[dirty,'dirty worktrees'],
    [tdOpen,'open td issues'],[fmtLoc(stars),'github stars'],['+274','★ gained 30d'],
  ].map(([b,l])=>`<div class="stat"><b>${b}</b>${l}</div>`).join('');
}

function viewsBar(){
  const el = document.getElementById('views');
  el.querySelectorAll('.chip').forEach(c=>c.remove());
  VIEWS.forEach(v=>{
    const n = P.filter(p=>p.views.includes(v.key)).length + (v.key==='dormant'?54:0);
    const c = document.createElement('button');
    c.className = `chip ${v.cls}` + (state.view===v.key?' active':'');
    c.innerHTML = `${v.label} <b>${n}</b>`;
    c.onclick = ()=>{ state.view = state.view===v.key?null:v.key; render(); };
    el.appendChild(c);
  });
}

function sortsBar(){
  const el = document.getElementById('sorts'); el.innerHTML='';
  SORTS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'sort'+(state.sort===s.key?' active':'');
    b.innerHTML = `${i+1} ${s.label}` + (state.sort===s.key?`<span class="dir">↓</span>`:'');
    b.onclick = ()=>{ state.sort=s.key; render(); };
    el.appendChild(b);
  });
}

function ghCell(p){
  if(!p.gh) return `<div class="gh"><span class="none">no remote</span></div>`;
  const g=p.gh;
  return `<div class="gh">
    <span class="ci ${g.ci}" title="ci: ${g.ci}"></span>
    <div class="m"><b>${fmtLoc(g.stars)}</b><span>★</span></div>
    <div class="m"><b class="up">+${g.delta}</b><span>30d</span></div>
    <div class="m"><b>${g.issues}</b><span>iss</span></div>
    <div class="m"><b>${g.prs}</b><span>pr${g.ext?`·${g.ext}ext`:''}</span></div>
  </div>`;
}

function tdCell(p){
  if(!p.td) return `<div class="td"><span class="none">—</span></div>`;
  const t=p.td;
  return `<div class="td"><span class="open">${t.open}</span>
    <span class="sub">${t.blocked?`<span class="blocked">${t.blocked} blk</span> · `:''}${t.review} rev</span></div>`;
}

function flagsCell(p){
  const F={ci:'▲',oldpr:'»',stale:'~',missing:'ø',cloc:'!'};
  const T={ci:'CI failing',oldpr:'old external PR',stale:'stale issues',missing:'missing from disk',cloc:'cloc failed'};
  return p.flags.map(f=>`<span class="${f==='ci'||f==='missing'?'':'warn'}" title="${T[f]}">${F[f]}</span>`).join(' ');
}

function drawer(p){
  const g = p.gh, t = p.td;
  const spark90 = p.spark.concat(p.spark.slice().reverse(),p.spark).slice(0,42);
  return `<div class="drawer" onclick="event.stopPropagation()">
    <div>
      <h4>Note</h4>
      <textarea>${p.note}</textarea>
      <div class="saved">saved · just now</div>
      <div class="actions">
        <button class="btn">Open in Finder</button>
        <button class="btn">Terminal</button>
        ${g?'<button class="btn">GitHub ↗</button>':''}
        <button class="btn danger">Hide</button>
      </div>
    </div>
    <div>
      <h4>Repository</h4>
      <dl class="kv">
        <dt>head</dt><dd>${p.branch} · a3f19c2</dd>
        <dt>lifetime commits</dt><dd>${(p.loc/9|0)+140}</dd>
        <dt>active days 30d</dt><dd>${Math.min(30,p.spark.filter(x=>x>0).length*2)}</dd>
        <dt>churn 30d</dt><dd>+${p.c30*61} −${p.c30*27}</dd>
        <dt>contributors</dt><dd>${g?Math.max(1,(g.ext||0)+2):1} · you 92%</dd>
        <dt>last tag</dt><dd>v0.8.2 · 31 commits ago</dd>
        <dt>loc</dt><dd>${fmtLoc(p.loc)} code · ${fmtLoc(p.loc*.18|0)} comment</dd>
        ${t?`<dt>td stale 30d</dt><dd>${Math.max(0,t.open-3)}</dd>`:''}
      </dl>
    </div>
    <div>
      <h4>Trend · commits / day · 90d</h4>
      <div class="bigspark">${sparkSvg(spark90, 240, 34)}</div>
      ${g?`<h4 style="margin-top:14px">GitHub · 30d</h4>
      <dl class="kv">
        <dt>★ trend</dt><dd class="up" style="color:var(--green)">+${g.delta} (${g.stars-g.delta} → ${g.stars})</dd>
        <dt>clones / uniques</dt><dd>318 / 92</dd>
        <dt>prs merged</dt><dd>11</dd>
        <dt>oldest ext pr</dt><dd>${g.oldest??'—'}</dd>
        <dt>last release</dt><dd>v0.8.2 · 19d ago</dd>
      </dl>`:`<h4 style="margin-top:14px">GitHub</h4>
      <dl class="kv"><dt>remote</dt><dd>none — local only</dd></dl>`}
    </div>
  </div>`;
}

function render(){
  viewsBar(); sortsBar();
  const list = document.getElementById('list');
  const sort = SORTS.find(s=>s.key===state.sort);
  let rows = P.filter(p=>!state.q || (p.name+p.path+p.note).toLowerCase().includes(state.q));
  if(state.view) rows = rows.filter(p=>p.views.includes(state.view));
  rows.sort((a,b)=> sort.fn(a,b) || a.name.localeCompare(b.name));
  if(state.favFirst) rows.sort((a,b)=>b.fav-a.fav);

  let html = `<div class="colhead">
    <span>★</span><span>project</span><span>branch</span><span>last commit</span>
    <span>activity 14d</span><span class="num">loc</span><span class="num">td</span>
    <span class="num">github</span><span></span></div>`;

  rows.forEach(p=>{
    const open = state.open===p.name;
    html += `<div class="row${p.fav?' fav':''}${open?' open-row':''}" data-name="${p.name}">
      <button class="star${p.fav?' on':''}" data-star="${p.name}">${p.fav?'★':'☆'}</button>
      <div class="proj">
        <div class="name">${p.name}<span class="path">~/${p.path}</span></div>
        <div class="note${p.note?'':' empty'}">${p.note}</div>
      </div>
      <div class="branch">${p.branch}${p.dirty?` <span class="dirty">●${p.dirty}</span>`:''}
        <span class="sync">${p.ahead||p.behind?`↑${p.ahead} ↓${p.behind}`:'in sync'}</span></div>
      <div class="commit"><span class="age ${ageClass(p.age)}">${fmtAge(p.age)}</span>
        <span class="subj">${p.subj}</span></div>
      <div class="spark">${sparkSvg(p.spark)}<span class="n">${p.c30}/30d</span></div>
      <div class="loc"><span class="val">${fmtLoc(p.loc)}</span>
        <span class="lang"><span class="dot" style="background:${LANG_COLORS[p.lang]}"></span>${p.lang}</span></div>
      ${tdCell(p)}
      ${ghCell(p)}
      <div style="display:flex;align-items:center;gap:2px">
        <span class="flags">${flagsCell(p)}</span>
        <button class="menu">⋮</button>
      </div>
    </div>`;
    if(open) html += drawer(p);
  });
  list.innerHTML = html;

  list.querySelectorAll('.row').forEach(r=>{
    r.onclick = ()=>{ const n=r.dataset.name; state.open = state.open===n?null:n; render(); };
  });
  list.querySelectorAll('.star').forEach(s=>{
    s.onclick = e=>{ e.stopPropagation();
      const p = P.find(x=>x.name===s.dataset.star); p.fav = p.fav?0:1; render(); };
  });
}

document.getElementById('search').oninput = e=>{ state.q=e.target.value.toLowerCase(); render(); };
document.getElementById('favFirst').onchange = e=>{ state.favFirst=e.target.checked; render(); };
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); document.getElementById('search').focus();
  }
});
ticker(); render();
</script>
</body>
</html>
